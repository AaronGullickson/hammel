url: https://aarongullickson.github.io/hammel/
template:
  bootstrap: 5
  math-rendering: mathjax
authors:
  Aaron Gullickson:
    href: https://aarongullickson.github.io

articles:
  - title: Guides
    navbar: ~
    contents:
      - articles/demographic_transition
      - articles/second_demog_transition
      - articles/multigroup_intermar

  - title: Technical
    navbar: Technical
    contents:
      - articles/how_it_works

reference:
  - title: Model setup and simulation
    desc: Construct a model, attach its population and processes, and run a simulation.
    contents:
      - hammel_model
      - set_population
      - set_groups
      - set_process
      - run_simulation

  - title: Population preparation
    desc: Create and validate starting populations and describe their group dimensions.
    contents:
      - hammel_population
      - summary.hammel_population
      - generate_uniform_population
      - validate_population
      - group

  - title: Rate preparation
    desc: Import demographic rates and prepare proportional rate strata.
    contents:
      - get_mortality_hmd
      - get_fertility_hfd
      - stratify_rates

  - title: Demographic processes
    desc: Specify mortality, fertility, unions, and group transitions.
    contents:
      - mortality
      - summary.hammel_mortality
      - fertility
      - summary.hammel_fertility
      - union_formation
      - union_dissolution
      - group_transition
      - household

  - title: Matching, inheritance, and weight models
    desc: Configure partner selection, newborn group inheritance, and selection within rate cells.
    contents:
      - matching_model
      - age_gap_matching_model
      - group_inheritance
      - weight_model

  - title: Demographic summaries
    desc: Calculate population sizes, observed event rates, and synthetic demographic measures.
    contents:
      - calculate_population_size
      - calculate_mortality_rates
      - calculate_life_table
      - calculate_life_expectancy
      - calculate_fertility_rates
      - calculate_tfr
      - calculate_patfr
      - calculate_union_rates
      - calculate_marriage_rates
      - calculate_dissolution_rates
      - calculate_cohab_convert_rate
      - calculate_transition_rates

  - title: Family and union histories
    desc: Extract kin relationships and enrich recorded person, birth, and union histories.
    contents:
      - extract_kin
      - count_kin
      - augment_persons
      - augment_unions
      - extract_unpartnered_births

  - title: Example data
    desc: Packaged demographic inputs for examples and exploration.
    contents:
      - usa_2000
      - england_wales_1992_onward
